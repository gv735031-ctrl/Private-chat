<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Chat</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
}

button,input{
    font-family:inherit;
}

.screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:430px;
    background:#1f2937;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-top:0;
}

input{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    background:#374151;
    color:white;
    outline:none;
    font-size:16px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.joinBtn{
    width:100%;
    margin-top:12px;
    background:#2563eb;
    color:white;
}

.joinBtn:hover{
    background:#1d4ed8;
}

.error{
    color:#f87171;
    text-align:center;
    margin-top:10px;
    font-size:14px;
}

/* CHAT */

#chatScreen{
    display:none;
    min-height:100vh;
    flex-direction:column;
}

.header{
    padding:14px 16px;
    background:#1f2937;
    border-bottom:1px solid #374151;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.owner{
    font-size:18px;
    font-weight:bold;
}

.room{
    color:#9ca3af;
    font-size:12px;
    margin-top:3px;
}

.online{
    color:#22c55e;
    font-size:13px;
    margin-top:5px;
}

.clearBtn{
    background:#dc2626;
    color:white;
    padding:9px 12px;
    font-size:13px;
}

#messages{
    flex:1;
    padding:15px;
    overflow-y:auto;
}

.message{
    max-width:82%;
    margin:8px 0;
    padding:10px 12px;
    border-radius:14px;
    background:#374151;
    word-wrap:break-word;
    position:relative;
}

.mine{
    margin-left:auto;
    background:#2563eb;
}

.sender{
    font-size:12px;
    opacity:.75;
    margin-bottom:5px;
}

.messageText{
    font-size:16px;
    white-space:pre-wrap;
}

.messageBottom{
    font-size:11px;
    opacity:.75;
    text-align:right;
    margin-top:5px;
}

.deleteBtn{
    display:none;
    margin-top:8px;
    background:#dc2626;
    color:white;
    font-size:12px;
    padding:6px 10px;
}

.message.mine:hover .deleteBtn{
    display:block;
}

#typing{
    height:25px;
    padding-left:15px;
    font-size:13px;
    color:#9ca3af;
}

.inputArea{
    display:flex;
    padding:10px;
    background:#1f2937;
    gap:8px;
    border-top:1px solid #374151;
}

#messageInput{
    margin:0;
    flex:1;
}

#sendButton{
    width:75px;
    background:#2563eb;
    color:white;
    margin:0;
}

#sendButton:hover{
    background:#1d4ed8;
}

/* NOTIFICATION */

.notification{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:400px;
    background:#1f2937;
    border:1px solid #4b5563;
    border-radius:12px;
    padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:none;
    z-index:9999;
}

.notificationTitle{
    font-weight:bold;
}

.notificationText{
    color:#d1d5db;
    margin-top:4px;
    font-size:14px;
}

.empty{
    text-align:center;
    color:#9ca3af;
    margin-top:40px;
}

</style>
</head>

<body>


<!-- =========================
     JOIN SCREEN
========================= -->

<div class="screen" id="joinScreen">

<div class="card">

<h1>🔒 Private Chat</h1>

<input
id="nameInput"
type="text"
placeholder="Apna naam / nickname"
maxlength="30"
>

<input
id="roomInput"
type="text"
placeholder="Room Code"
maxlength="30"
>

<button
class="joinBtn"
id="joinButton"
>
JOIN ROOM
</button>

<div
class="error"
id="error"
></div>

</div>

</div>


<!-- =========================
     CHAT SCREEN
========================= -->

<div id="chatScreen">


<div class="header">

<div>

<div class="owner">
🔒 Owner: Govind
</div>

<div class="room">
Room: <span id="roomName"></span>
</div>

<div class="online">
🟢 <span id="onlineCount">0</span> Online
</div>

</div>

<button
class="clearBtn"
id="clearButton"
>
Clear
</button>

</div>


<div id="messages">

<div class="empty" id="emptyMessage">
Abhi koi message nahi hai.
</div>

</div>


<div id="typing"></div>


<div class="inputArea">

<input
id="messageInput"
type="text"
placeholder="Message likho..."
autocomplete="off"
maxlength="2000"
>

<button
id="sendButton"
>
Send
</button>

</div>

</div>


<!-- =========================
     CUSTOM NOTIFICATION
========================= -->

<div
class="notification"
id="customNotification"
>

<div
class="notificationTitle"
id="notificationTitle"
></div>

<div
class="notificationText"
id="notificationText"
></div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();


let myName = "";
let myRoom = "";
let typingTimer = null;


/* ELEMENTS */

const joinScreen =
document.getElementById("joinScreen");

const chatScreen =
document.getElementById("chatScreen");

const nameInput =
document.getElementById("nameInput");

const roomInput =
document.getElementById("roomInput");

const joinButton =
document.getElementById("joinButton");

const roomName =
document.getElementById("roomName");

const onlineCount =
document.getElementById("onlineCount");

const messages =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const typing =
document.getElementById("typing");

const errorBox =
document.getElementById("error");

const clearButton =
document.getElementById("clearButton");

const emptyMessage =
document.getElementById("emptyMessage");

const customNotification =
document.getElementById("customNotification");

const notificationTitle =
document.getElementById("notificationTitle");

const notificationText =
document.getElementById("notificationText");


/* =========================
   BROWSER NOTIFICATION
========================= */

async function requestNotificationPermission(){

    if(!("Notification" in window)){
        return;
    }

    if(Notification.permission === "default"){

        try{

            await Notification.requestPermission();

        }catch(error){

            console.log(error);

        }

    }

}


function showNotification(title,text){

    /*
       Browser background notification
    */

    if(
        "Notification" in window &&
        Notification.permission === "granted" &&
        document.visibilityState !== "visible"
    ){

        try{

            new Notification(title,{
                body:text,
                icon:"/favicon.ico"
            });

        }catch(error){

            console.log(error);

        }

    }


    /*
       Website notification
    */

    if(document.visibilityState === "visible"){

        notificationTitle.textContent = title;

        notificationText.textContent = text;

        customNotification.style.display = "block";


        setTimeout(()=>{

            customNotification.style.display = "none";

        },4000);

    }

}


/* =========================
   JOIN
========================= */

joinButton.addEventListener(
"click",
async()=>{

    myName =
    nameInput.value.trim();

    myRoom =
    roomInput.value.trim().toUpperCase();


    if(!myName){

        errorBox.textContent =
        "Apna naam dalo.";

        return;

    }


    if(!myRoom){

        errorBox.textContent =
        "Room Code dalo.";

        return;

    }


    errorBox.textContent = "";


    await requestNotificationPermission();


    socket.emit(
        "joinRoom",
        {
            name:myName,
            roomCode:myRoom
        }
    );


    roomName.textContent =
    myRoom;


    joinScreen.style.display =
    "none";

    chatScreen.style.display =
    "flex";


    messageInput.focus();

});


/* ENTER JOIN */

nameInput.addEventListener(
"keydown",
e=>{

    if(e.key === "Enter"){

        roomInput.focus();

    }

});


roomInput.addEventListener(
"keydown",
e=>{

    if(e.key === "Enter"){

        joinButton.click();

    }

});


/* =========================
   ONLINE USERS
========================= */

socket.on(
"onlineUsers",
users=>{

    onlineCount.textContent =
    users.length;

});


/* =========================
   MESSAGE HISTORY
========================= */

socket.on(
"messageHistory",
history=>{

    messages.innerHTML = "";


    if(history.length === 0){

        messages.appendChild(
            createEmptyMessage()
        );

    }


    history.forEach(
        message=>{
            addMessage(message);
        }
    );


    scrollBottom();

});


function createEmptyMessage(){

    const div =
    document.createElement("div");

    div.className = "empty";

    div.textContent =
    "Abhi koi message nahi hai.";

    return div;

}


/* =========================
   NEW MESSAGE
========================= */

socket.on(
"newMessage",
message=>{

    const oldEmpty =
    messages.querySelector(".empty");

    if(oldEmpty){
        oldEmpty.remove();
    }


    addMessage(message);

    scrollBottom();


    /*
       Agar message doosre user ka hai
    */

    if(message.senderId !== socket.id){

        socket.emit(
            "messageDelivered",
            {
                messageId:message.id
            }
        );


        if(
            document.visibilityState ===
            "visible"
        ){

            socket.emit(
                "messageSeen",
                {
                    messageId:message.id
                }
            );

        }


        showNotification(
            message.senderName,
            message.text
        );

    }

});


/* =========================
   ADD MESSAGE
========================= */

function addMessage(message){

    const div =
    document.createElement("div");

    div.className =
    "message";


    const isMine =
    message.senderId === socket.id;


    if(isMine){

        div.classList.add("mine");

    }


    /* SENDER */

    const sender =
    document.createElement("div");

    sender.className =
    "sender";

    sender.textContent =
    isMine
        ? "You"
        : message.senderName;


    /* TEXT */

    const text =
    document.createElement("div");

    text.className =
    "messageText";

    text.textContent =
    message.text;


    /* BOTTOM */

    const bottom =
    document.createElement("div");

    bottom.className =
    "messageBottom";


    const time =
    new Date(message.time);


    bottom.textContent =
    time.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );


    if(isMine){

        bottom.dataset.messageId =
        message.id;

        bottom.textContent +=
        "  ✓";

    }


    /* DELETE */

    if(isMine){

        const deleteButton =
        document.createElement("button");

        deleteButton.className =
        "deleteBtn";

        deleteButton.textContent =
        "🗑️ Delete for everyone";


        deleteButton.addEventListener(
        "click",
        ()=>{

            const confirmDelete =
            confirm(
                "Kya message sabke liye delete karna hai?"
            );


            if(confirmDelete){

                socket.emit(
                    "deleteMessageForEveryone",
                    {
                        messageId:message.id
                    }
                );

            }

        });


        div.appendChild(
            deleteButton
        );

    }


    div.appendChild(sender);

    div.appendChild(text);

    div.appendChild(bottom);


    div.dataset.id =
    message.id;


    messages.appendChild(div);

}


/* =========================
   MESSAGE STATUS
========================= */

socket.on(
"messageStatus",
data=>{

    const element =
    document.querySelector(
        `[data-message-id="${data.messageId}"]`
    );


    if(!element) return;


    const time =
    element.textContent
    .split("  ")[0];


    if(data.status === "sent"){

        element.textContent =
        time + "  ✓";

    }


    if(data.status === "delivered"){

        element.textContent =
        time + "  ✓✓";

    }


    if(data.status === "seen"){

        element.textContent =
        time + "  ✓✓ Seen";

    }

});


/* =========================
   DELETE MESSAGE EVENT
========================= */

socket.on(
"messageDeleted",
data=>{

    const message =
    messages.querySelector(
        `[data-id="${data.messageId}"]`
    );


    if(message){

        message.remove();

    }


    if(
        messages.querySelectorAll(
            ".message"
        ).length === 0
    ){

        messages.appendChild(
            createEmptyMessage()
        );

    }

});


/* =========================
   CLEAR CHAT
========================= */

clearButton.addEventListener(
"click",
()=>{

    const confirmClear =
    confirm(
        "Kya poori chat sabke liye clear karni hai?"
    );


    if(!confirmClear){
        return;
    }


    socket.emit(
        "clearChat"
    );

});


socket.on(
"chatCleared",
()=>{

    messages.innerHTML = "";

    messages.appendChild(
        createEmptyMessage()
    );

});


/* =========================
   TYPING
========================= */

messageInput.addEventListener(
"input",
()=>{

    socket.emit(
        "typing"
    );


    clearTimeout(
        typingTimer
    );


    typingTimer =
    setTimeout(
        ()=>{

            socket.emit(
                "stopTyping"
            );

        },
        1000
    );

});


socket.on(
"userTyping",
user=>{

    typing.textContent =
    user.name +
    " is typing...";

});


socket.on(
"userStoppedTyping",
()=>{

    typing.textContent = "";

});


/* =========================
   SEND MESSAGE
========================= */

function sendMessage(){

    const text =
    messageInput.value.trim();


    if(!text){
        return;
    }


    socket.emit(
        "sendMessage",
        text
    );


    messageInput.value = "";

    socket.emit(
        "stopTyping"
    );


    messageInput.focus();

}


sendButton.addEventListener(
"click",
sendMessage
);


messageInput.addEventListener(
"keydown",
event=>{

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

});


/* =========================
   VISIBILITY / SEEN
========================= */

document.addEventListener(
"visibilitychange",
()=>{

    if(
        document.visibilityState ===
        "visible"
    ){

        /*
           Visible होने पर latest messages
           को seen भेजने के लिए server को
           messageSeen events भेजेंगे।
        */

        const messageElements =
        messages.querySelectorAll(
            ".message"
        );


        messageElements.forEach(
        element=>{

            const id =
            element.dataset.id;

            if(id){

                socket.emit(
                    "messageSeen",
                    {
                        messageId:id
                    }
                );

            }

        });

    }

});


/* =========================
   SCROLL
========================= */

function scrollBottom(){

    messages.scrollTop =
    messages.scrollHeight;

}


/* =========================
   ERROR
========================= */

socket.on(
"errorMessage",
message=>{

    errorBox.textContent =
    message;

});


/* =========================
   USER JOINED
========================= */

socket.on(
"userJoined",
user=>{

    showNotification(
        "Private Chat",
        user.name + " online aa gaya."
    );

});


/* =========================
   USER LEFT
========================= */

socket.on(
"userLeft",
user=>{

    showNotification(
        "Private Chat",
        user.name + " offline ho gaya."
    );

});


</script>

</body>
</html>
